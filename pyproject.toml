[project]
name = "eeg-envelope-coherence-neuroimage"
version = "0.1.0"
description = "EEG envelope coherence analysis project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.5",
    "scipy>=1.11",
    "requests>=2.31",
    "tqdm>=4.0",
    "mne>=1.12.1",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
transcription = [
    "whisperx>=3.1",
    "torch>=2.2",
    "torchaudio>=2.2",
]
mfa = [
    "montreal-forced-aligner>=2.2.17; python_version < '3.11'",
]
gammatone-brian2 = [
    "brian2hears>=0.9.2",
]
speech-units = [
    "praatio>=6.0",
    "praat-parselmouth>=0.4.3",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    # sentences_clauses.py; the Dutch model is a separate download:
    #   python -m spacy download nl_core_news_lg
    "spacy>=3.7",
    # Transitive requirements of the wavelet prosody toolkit, which is not on
    # PyPI: clone https://github.com/asuni/wavelet_prosody_toolkit and point
    # WAVELET_PROSODY_TOOLKIT_DIR at it (needed by intonation_units.py only).
    "pycwt>=0.3",
    "tgt>=1.4",
    "soundfile>=0.12",
    "wavio>=0.0.8",
    "joblib>=1.3",
    "matplotlib>=3.7",
]
cuda = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-nvcc-cu12",
]
all = [
    "pytest>=8.0",
    "praatio>=6.0",
    "praat-parselmouth>=0.4.3",
    "scikit-learn>=1.3",
    "whisperx>=3.1",
    "torch>=2.2",
    "torchaudio>=2.2",
    "requests>=2.31",
    "numpy==2.2.5",
    "scipy>=1.11",
    "tqdm>=4.0",
    "montreal-forced-aligner>=2.2.17; python_version < '3.11'",
    "brian2hears>=0.9.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
